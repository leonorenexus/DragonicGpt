<!DOCTYPE html>
<html>
<head>
    <title>🐉 DragonGPT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; }
        
        .container { max-width: 800px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        
        .header {
            background: #111; padding: 20px; border-bottom: 2px solid #00ff88;
            text-align: center;
        }
        .header h1 { color: #00ff88; font-size: 28px; }
        .header p { color: #666; font-size: 14px; margin-top: 5px; }
        
        .messages {
            flex: 1; overflow-y: auto; padding: 20px;
        }
        
        .msg { margin-bottom: 20px; }
        .msg.user { text-align: right; }
        .msg.bot { text-align: left; }
        .msg .bubble {
            display: inline-block; max-width: 80%; padding: 15px 20px;
            border-radius: 15px; font-size: 15px; line-height: 1.6;
        }
        .msg.user .bubble { background: #00ff88; color: #000; border-radius: 15px 15px 0 15px; }
        .msg.bot .bubble { background: #1a1a1a; color: #eee; border: 1px solid #333; border-radius: 15px 15px 15px 0; }
        .msg .label { font-size: 12px; color: #666; margin-bottom: 5px; }
        
        .input-area {
            padding: 20px; background: #111; border-top: 2px solid #00ff88;
            display: flex; gap: 10px;
        }
        .input-area input {
            flex: 1; padding: 15px; background: #1a1a1a; border: 1px solid #333;
            color: #fff; border-radius: 10px; font-size: 16px;
        }
        .input-area input:focus { outline: none; border-color: #00ff88; }
        .input-area button {
            padding: 15px 30px; background: #00ff88; color: #000;
            border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;
        }
        .input-area button:hover { background: #00cc6a; }
        
        .status { color: #00ff88; font-size: 12px; text-align: center; padding: 8px; }
        .status.error { color: #ff4444; }
        
        .welcome {
            text-align: center; padding: 40px 20px; color: #666;
        }
        .welcome h2 { color: #00ff88; font-size: 22px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐉 DragonGPT</h1>
            <p>Eksklusif — Leonore Tech Team</p>
        </div>
        
        <div class="messages" id="messages">
            <div class="welcome">
                <h2>🐉 Selamat datang, anak buah Pai Leonore</h2>
                <p>DragonGPT siap membantu. Langsung ketik pesan.</p>
            </div>
        </div>
        
        <div class="status" id="status">Online — Siap membantu</div>
        
        <div class="input-area">
            <input type="text" id="input" placeholder="Ketik pesan..." 
                onkeypress="if(event.key==='Enter') send()" autofocus>
            <button onclick="send()">Kirim</button>
        </div>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;
            
            // Hapus welcome message kalo masih ada
            const welcome = document.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            // Tampilkan pesan user
            addMessage('user', msg);
            input.value = '';
            setStatus('Mengetik...', '');
            
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                addMessage('bot', data.response);
                setStatus('Online — Siap membantu', '');
            } catch(e) {
                addMessage('bot', '❌ Error: Gak bisa konek ke server. Coba lagi.');
                setStatus('Error koneksi', 'error');
            }
        }
        
        function addMessage(role, text) {
            const div = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg ' + role;
            msgDiv.innerHTML = `
                <div class="label">${role === 'user' ? 'Kamu' : '🐉 DragonGPT'}</div>
                <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
            `;
            div.appendChild(msgDiv);
            div.scrollTop = div.scrollHeight;
        }
        
        function setStatus(text, type) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status' + (type ? ' ' + type : '');
        }
    </script>
</body>
</html>
